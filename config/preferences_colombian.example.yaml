# Copy this file to /content/preferences_colombian.yaml in Google Colab.
# Keep private data, participant mappings, archives, and credentials outside Git.
# Change run.branch to exactly one of: asv, otu.

run:
  name: colombian_16s
  branch: asv
  qiime2_release: "2024.10"
  project_dir: /content/project
  results_dir: /content/project/results/colombian_full
  ml_dir: /content/week4_dataset1
  archive_dir: /content/drive/MyDrive/microbiome_colab/results

biology:
  enabled: true

input:
  drive_root: /content/drive/MyDrive/ML_colombian_colab
  repository: https://github.com/Luna-Maan/CSthesis.git
  repository_dir: /content/project/CSthesis
  qiime_metadata_source: metadata_files/colombian_metadata.tsv
  phenotype_metadata: participants_v3_corrected_depflag.tsv
  run_participant_map: Colombian-metadata.xlsx
  run_participant_sheet: Meta-data
  download_from_sra: true

reads:
  directory: /content/project/CSthesis/fastq_full
  layout: paired_end
  patterns:
    forward: '^(?P<sample_id>.+?)_1\.(?:fastq|fq)(?:\.gz)?$'
    reverse: '^(?P<sample_id>.+?)_2\.(?:fastq|fq)(?:\.gz)?$'

metadata:
  qiime_sample_id_column: sample-id
  phenotype_id_column: participant_id
  phenotype_group_column: dep_flag_corrected
  group_column: group
  label_map:
    "0": healthy
    "1": depressive
    control: healthy
    healthy: healthy
    disease: depressive
    depressive: depressive

primers:
  enabled: true
  forward: CCTACGGGNGGCWGCAG
  reverse: GACTACHVGGGTATCTAATCC
  forward_name: Bakt_341F
  reverse_name: Bakt_805R

adapters:
  enabled: false
  forward: null
  reverse: null
  preset: null

quality:
  trunc_len_f: 283
  trunc_len_r: 229
  sampling_depth: 27892
  min_quality: 28
  max_expected_errors: 2
  error_rate: 0.1
  min_length: 0
  trim_left_f: 0
  trim_left_r: 0

taxonomy:
  classifier: /content/project/refs/silva-138-99-nb-classifier.qza
  silva_release: SILVA_138
  marker_region: 341F-805R
  confidence: 0.70
  download_if_missing: true

otu:
  similarity: 0.97

filtering:
  bacteria_only: true
  remove_mitochondria: true
  remove_chloroplast: true
  keep_unclassified: false
  min_prevalence: 0.10
  min_total_abundance: 10

diversity:
  alpha_metrics:
    - shannon
    - observed_features
    - pielou_evenness
    - chao1
    - faith_pd
  beta_metrics:
    - jaccard
    - bray_curtis
    - unweighted_unifrac
    - weighted_unifrac
  rarefaction: true

ml:
  enabled: true
  selector: original_3_method
  anova_p_cutoff: 0.05
  mutual_information_percentile: 95
  random_forest_importance_rule: greater_than_1_over_n_taxa
  consensus_min_methods: 2
  feature_selection_percent: 40.91
  train_percent: 38.64
  test_percent: 20.45
  random_states: [42, 43, 44, 45, 46]
  pseudocount: 0.5

reporting:
  archive_outputs: true
  write_excel: true
  write_checksums: true
